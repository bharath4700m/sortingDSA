<!DOCTYPE html>
<html>
<head>
<title>Student-Centric DSA Searching & Sorting Visualizer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    text-align:center;
    background:linear-gradient(135deg,#a8edea,#fed6e3);
    margin:0;
    color:#222;
}

h1{
    margin:20px 10px 5px;
    font-size:32px;
    color:#2c3e50;
}

.subtitle{
    font-size:17px;
    color:#555;
}

.controls{
    margin:20px auto;
    padding:20px;
    width:95%;
    max-width:1200px;
    background:rgba(255,255,255,.9);
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

input,select,button{
    padding:12px;
    margin:7px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

input[type="text"]{
    width:300px;
}

button{
    background:#4CAF50;
    color:white;
    font-weight:bold;
    cursor:pointer;
    border:none;
}

button:hover{
    background:#388e3c;
}

button.reset{
    background:#e53935;
}

button.reset:hover{
    background:#c62828;
}

select{
    min-width:220px;
}

#category{
    font-weight:bold;
}

.array-container{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    min-height:430px;
    margin:25px auto;
    width:96%;
    overflow-x:auto;
    padding:30px 15px 50px;
}

.bar{
    min-width:55px;
    margin:5px;
    background:#42a5f5;
    border-radius:10px 10px 4px 4px;
    font-weight:bold;
    font-size:16px;
    position:relative;
    transition:all .35s ease;
    box-shadow:0 7px 14px rgba(0,0,0,.18);
}

.bar span{
    position:absolute;
    bottom:-30px;
    left:0;
    width:100%;
}

.bar.active{
    background:#ff9800 !important;
    transform:translateY(-20px);
}

.bar.compare{
    background:#ff9800 !important;
}

.bar.swap{
    background:#e53935 !important;
    transform:translateY(-25px);
}

.bar.found{
    background:#2e7d32 !important;
    transform:translateY(-20px);
}

.bar.done{
    background:#43a047 !important;
}

.bar.pivot{
    background:#9c27b0 !important;
    transform:translateY(-20px);
}

.bar.range{
    background:#90caf9 !important;
}

#explanationBox{
    margin:20px auto;
    width:90%;
    max-width:1100px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.18);
    font-size:21px;
    font-weight:bold;
    min-height:90px;
    color:#2c3e50;
}

#stats{
    font-size:18px;
    margin:15px;
    font-weight:bold;
}

#complexity{
    margin:15px auto;
    padding:15px;
    width:90%;
    max-width:1000px;
    background:rgba(255,255,255,.8);
    border-radius:12px;
    font-size:16px;
}

.section-title{
    margin-top:35px;
    color:#263238;
}

.hidden{
    display:none;
}

.info{
    margin:10px auto;
    width:90%;
    max-width:1000px;
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:left;
}

@media(max-width:700px){
    input[type="text"]{
        width:90%;
    }

    .bar{
        min-width:42px;
    }
}
</style>
</head>

<body>

<h1>📚 Student-Centric DSA Visualizer</h1>

<div class="subtitle">
Searching + Sorting Algorithms — Interactive Learning
</div>

<div class="controls">

<select id="category">
    <option value="sorting">🔃 Sorting</option>
    <option value="searching">🔎 Searching</option>
</select>

<input
    type="text"
    id="arrayInput"
    placeholder="Enter numbers: 5,3,8,1,7"
>

<input
    type="number"
    id="searchKey"
    placeholder="Search key"
>

<select id="algorithm"></select>

<br>

<label>
    🐢 Learning Speed:
</label>

<input
    type="range"
    min="100"
    max="2000"
    value="700"
    id="speed"
>

<span id="speedValue">700 ms</span>

<br>

<button onclick="start()">▶ Start Learning</button>
<button class="reset" onclick="resetVisualizer()">↻ Reset</button>

</div>

<div class="array-container" id="arrayContainer"></div>

<div id="explanationBox">
    Welcome! Enter numbers and select an algorithm.
</div>

<div id="stats">
    Comparisons: 0 | Swaps: 0 | Operations: 0
</div>

<div id="complexity">
    Select an algorithm to see its complexity.
</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let delay = 700;
let comparisons = 0;
let swaps = 0;
let operations = 0;
let running = false;

const BLUE = "#42a5f5";


/* =========================================================
   ALGORITHM LISTS
========================================================= */

const sortingAlgorithms = {

    "Comparison-Based":[
        "Bubble Sort",
        "Selection Sort",
        "Insertion Sort",
        "Shell Sort",
        "Merge Sort",
        "Quick Sort",
        "Heap Sort",
        "Tree Sort",
        "TimSort",
        "IntroSort"
    ],

    "Non-Comparison":[
        "Counting Sort",
        "Radix Sort",
        "Bucket Sort"
    ],

    "Specialized":[
        "External Merge Sort",
        "K-Way Merge",
        "Bitonic Sort",
        "Parallel Sorting",
        "Distributed Sorting"
    ]
};

const searchingAlgorithms = {

    "Basic":[
        "Linear Search",
        "Binary Search",
        "Jump Search",
        "Interpolation Search",
        "Exponential Search",
        "Fibonacci Search"
    ],

    "Hashing":[
        "Hash Search"
    ],

    "Tree Searching":[
        "BST Search",
        "AVL Tree Search",
        "Red-Black Tree Search",
        "B-Tree Search",
        "Trie Search"
    ],

    "Graph Searching":[
        "BFS",
        "DFS"
    ]
};


/* =========================================================
   COMPLEXITY DATABASE
========================================================= */

const complexity = {

"Bubble Sort":
"Best: O(n) | Average: O(n²) | Worst: O(n²) | Stable: Yes",

"Selection Sort":
"Best/Average/Worst: O(n²) | Stable: Usually No",

"Insertion Sort":
"Best: O(n) | Average/Worst: O(n²) | Stable: Yes",

"Shell Sort":
"Depends on gap sequence | Common worst-case around O(n²)",

"Merge Sort":
"Best/Average/Worst: O(n log n) | Stable: Yes | Extra Space: O(n)",

"Quick Sort":
"Best/Average: O(n log n) | Worst: O(n²) | Usually In-place",

"Heap Sort":
"Best/Average/Worst: O(n log n) | Space: O(1) | Stable: No",

"Tree Sort":
"Average: O(n log n) | Worst: O(n²)",

"TimSort":
"Best: O(n) | Average/Worst: O(n log n) | Stable",

"IntroSort":
"Average: O(n log n) | Worst: O(n log n)",

"Counting Sort":
"O(n + k) | Non-comparison sorting",

"Radix Sort":
"O(d(n+k)) | Depends on digits",

"Bucket Sort":
"Average: O(n+k) under suitable distribution | Worst: O(n²)",

"External Merge Sort":
"O(n log n) | Designed for data larger than memory",

"K-Way Merge":
"O(N log K)",

"Bitonic Sort":
"O(log² n) parallel comparison stages",

"Parallel Sorting":
"Depends on workers/chunks | Parallelized sorting concept",

"Distributed Sorting":
"Depends on nodes and data partitioning",

"Linear Search":
"Best: O(1) | Average: O(n) | Worst: O(n)",

"Binary Search":
"O(log n) | Requires sorted data",

"Jump Search":
"O(√n) | Requires sorted data",

"Interpolation Search":
"Average: O(log log n) | Worst: O(n)",

"Exponential Search":
"O(log n) | Requires sorted data",

"Fibonacci Search":
"O(log n) | Requires sorted data",

"Hash Search":
"Average: O(1) | Worst: O(n)",

"BST Search":
"Average: O(log n) | Worst: O(n)",

"AVL Tree Search":
"O(log n)",

"Red-Black Tree Search":
"O(log n)",

"B-Tree Search":
"O(log n)",

"Trie Search":
"O(L), where L = key length",

"BFS":
"O(V + E)",

"DFS":
"O(V + E)"
};


/* =========================================================
   UI
========================================================= */

const categorySelect =
    document.getElementById("category");

const algorithmSelect =
    document.getElementById("algorithm");

const searchKey =
    document.getElementById("searchKey");

const speedInput =
    document.getElementById("speed");

const speedValue =
    document.getElementById("speedValue");


categorySelect.addEventListener("change",updateAlgorithms);

algorithmSelect.addEventListener("change",function(){

    const algo = this.value;

    searchKey.style.display =
        categorySelect.value === "searching"
        ? "inline-block"
        : "none";

    document.getElementById("complexity").innerText =
        complexity[algo] || "";

});


speedInput.addEventListener("input",function(){

    delay = Number(this.value);

    speedValue.innerText =
        delay + " ms";

});


function updateAlgorithms(){

    algorithmSelect.innerHTML = "";

    const data =
        categorySelect.value === "sorting"
        ? sortingAlgorithms
        : searchingAlgorithms;

    for(const group in data){

        const optgroup =
            document.createElement("optgroup");

        optgroup.label = group;

        data[group].forEach(algo=>{

            const option =
                document.createElement("option");

            option.value = algo;
            option.textContent = algo;

            optgroup.appendChild(option);

        });

        algorithmSelect.appendChild(optgroup);
    }

    searchKey.style.display =
        categorySelect.value === "searching"
        ? "inline-block"
        : "none";

    document.getElementById("complexity").innerText =
        complexity[algorithmSelect.value] || "";

}

updateAlgorithms();


/* =========================================================
   BASIC FUNCTIONS
========================================================= */

function sleep(ms){
    return new Promise(resolve =>
        setTimeout(resolve,ms)
    );
}


function updateExplanation(text){
    document.getElementById("explanationBox")
        .innerText = text;
}


function updateStats(){

    document.getElementById("stats").innerText =
        `Comparisons: ${comparisons} | ` +
        `Swaps: ${swaps} | ` +
        `Operations: ${operations}`;

}


function createBars(arr,colors=[]){

    const container =
        document.getElementById("arrayContainer");

    container.innerHTML = "";

    const max =
        Math.max(...arr.map(x => Math.abs(x)),1);

    arr.forEach((value,index)=>{

        const bar =
            document.createElement("div");

        bar.className = "bar";

        let height =
            50 + (Math.abs(value)/max)*280;

        bar.style.height =
            height + "px";

        if(colors[index]){
            bar.classList.add(colors[index]);
        }

        bar.innerHTML =
            `<span>${value}</span>`;

        container.appendChild(bar);

    });

}


function colorBars(indexes,className){

    const bars =
        document.querySelectorAll(".bar");

    indexes.forEach(i=>{

        if(bars[i])
            bars[i].classList.add(className);

    });

}


function clearBarColors(){

    document
        .querySelectorAll(".bar")
        .forEach(bar=>{

            bar.classList.remove(
                "active",
                "compare",
                "swap",
                "found",
                "done",
                "pivot",
                "range"
            );

            bar.style.background =
                BLUE;

        });

}


async function showArray(arr,colors=[]){

    createBars(arr,colors);

    operations++;

    updateStats();

    await sleep(delay);

}


/* =========================================================
   SWAP
========================================================= */

async function animatedSwap(arr,i,j){

    if(i === j) return;

    comparisons += 0;
    swaps++;
    operations++;

    let colors =
        new Array(arr.length).fill("");

    colors[i] = "swap";
    colors[j] = "swap";

    createBars(arr,colors);

    updateExplanation(
        `Swapping ${arr[i]} and ${arr[j]}`
    );

    updateStats();

    await sleep(delay);

    [arr[i],arr[j]] =
        [arr[j],arr[i]];

    createBars(arr);

    await sleep(delay/2);
}


/* =========================================================
   BUBBLE SORT
========================================================= */

async function bubbleSort(arr){

    updateExplanation(
        "Bubble Sort: compare adjacent elements."
    );

    for(let i=0;i<arr.length;i++){

        for(let j=0;j<arr.length-i-1;j++){

            comparisons++;

            let colors =
                new Array(arr.length).fill("");

            colors[j]="compare";
            colors[j+1]="compare";

            createBars(arr,colors);

            updateExplanation(
                `Comparing ${arr[j]} and ${arr[j+1]}`
            );

            updateStats();

            await sleep(delay);

            if(arr[j] > arr[j+1]){

                await animatedSwap(arr,j,j+1);

            }

        }

        colorBars([arr.length-i-1],"done");

    }

    updateExplanation(
        "🎉 Bubble Sort Completed!"
    );

}


/* =========================================================
   SELECTION SORT
========================================================= */

async function selectionSort(arr){

    for(let i=0;i<arr.length;i++){

        let min=i;

        updateExplanation(
            `Finding minimum for position ${i}`
        );

        for(let j=i+1;j<arr.length;j++){

            comparisons++;

            let colors =
                new Array(arr.length).fill("");

            colors[min]="active";
            colors[j]="compare";

            createBars(arr,colors);

            updateExplanation(
                `Compare current minimum ${arr[min]} with ${arr[j]}`
            );

            updateStats();

            await sleep(delay);

            if(arr[j] < arr[min])
                min=j;

        }

        if(min !== i)
            await animatedSwap(arr,i,min);

        colorBars([i],"done");

    }

    updateExplanation(
        "🎉 Selection Sort Completed!"
    );

}


/* =========================================================
   INSERTION SORT
========================================================= */

async function insertionSort(arr){

    for(let i=1;i<arr.length;i++){

        let key=arr[i];
        let j=i-1;

        updateExplanation(
            `Key = ${key}. Insert it into the sorted portion.`
        );

        await sleep(delay);

        while(j>=0){

            comparisons++;

            if(arr[j] <= key)
                break;

            arr[j+1]=arr[j];

            createBars(arr);

            updateExplanation(
                `${arr[j]} > ${key}, shift ${arr[j]} right`
            );

            updateStats();

            await sleep(delay);

            j--;
        }

        arr[j+1]=key;

        createBars(arr);

        await sleep(delay/2);

    }

    for(let i=0;i<arr.length;i++)
        colorBars([i],"done");

    updateExplanation(
        "🎉 Insertion Sort Completed!"
    );

}


/* =========================================================
   SHELL SORT
========================================================= */

async function shellSort(arr){

    for(let gap=Math.floor(arr.length/2);
        gap>0;
        gap=Math.floor(gap/2)){

        updateExplanation(
            `Shell Sort: current gap = ${gap}`
        );

        await sleep(delay);

        for(let i=gap;i<arr.length;i++){

            let temp=arr[i];
            let j=i;

            while(j>=gap){

                comparisons++;

                if(arr[j-gap] <= temp)
                    break;

                arr[j]=arr[j-gap];

                createBars(arr);

                updateExplanation(
                    `Moving ${arr[j-gap]} because it is greater than ${temp}`
                );

                updateStats();

                await sleep(delay);

                j-=gap;
            }

            arr[j]=temp;

        }

    }

    createBars(arr);

    updateExplanation(
        "🎉 Shell Sort Completed!"
    );

}


/* =========================================================
   MERGE SORT
========================================================= */

async function mergeSort(arr,left=0,right=arr.length-1){

    if(left>=right)
        return;

    let mid =
        Math.floor((left+right)/2);

    updateExplanation(
        `Divide: [${left}...${mid}] and [${mid+1}...${right}]`
    );

    await sleep(delay);

    await mergeSort(arr,left,mid);
    await mergeSort(arr,mid+1,right);

    let temp=[];
    let i=left;
    let j=mid+1;

    while(i<=mid && j<=right){

        comparisons++;

        if(arr[i] <= arr[j])
            temp.push(arr[i++]);
        else
            temp.push(arr[j++]);

    }

    while(i<=mid)
        temp.push(arr[i++]);

    while(j<=right)
        temp.push(arr[j++]);

    for(let k=0;k<temp.length;k++)
        arr[left+k]=temp[k];

    createBars(arr);

    updateExplanation(
        `Merged section ${left} to ${right}`
    );

    updateStats();

    await sleep(delay);

}


/* =========================================================
   QUICK SORT
========================================================= */

async function quickSort(arr,left=0,right=arr.length-1){

    if(left>=right)
        return;

    let pivot =
        arr[right];

    let p=left;

    let colors =
        new Array(arr.length).fill("");

    colors[right]="pivot";

    createBars(arr,colors);

    updateExplanation(
        `Pivot = ${pivot}`
    );

    await sleep(delay);

    for(let i=left;i<right;i++){

        comparisons++;

        if(arr[i] < pivot){

            await animatedSwap(
                arr,i,p
            );

            p++;
        }

    }

    await animatedSwap(
        arr,p,right
    );

    await quickSort(
        arr,left,p-1
    );

    await quickSort(
        arr,p+1,right
    );

}


/* =========================================================
   HEAP SORT
========================================================= */

async function heapify(arr,n,i){

    let largest=i;

    let left=2*i+1;
    let right=2*i+2;

    if(left<n){

        comparisons++;

        if(arr[left]>arr[largest])
            largest=left;

    }

    if(right<n){

        comparisons++;

        if(arr[right]>arr[largest])
            largest=right;

    }

    if(largest!==i){

        await animatedSwap(
            arr,i,largest
        );

        await heapify(
            arr,n,largest
        );

    }

}


async function heapSort(arr){

    updateExplanation(
        "Building Max Heap..."
    );

    for(let i=Math.floor(arr.length/2)-1;
        i>=0;
        i--){

        await heapify(
            arr,
            arr.length,
            i
        );

    }

    for(let i=arr.length-1;i>0;i--){

        await animatedSwap(
            arr,0,i
        );

        colorBars([i],"done");

        await heapify(
            arr,
            i,
            0
        );

    }

    updateExplanation(
        "🎉 Heap Sort Completed!"
    );

}


/* =========================================================
   TREE SORT
========================================================= */

class BSTNode{

    constructor(value){
        this.value=value;
        this.left=null;
        this.right=null;
    }

}


function bstInsert(root,value){

    if(!root)
        return new BSTNode(value);

    if(value < root.value)
        root.left =
            bstInsert(root.left,value);
    else
        root.right =
            bstInsert(root.right,value);

    return root;

}


async function inorder(root,result){

    if(!root)
        return;

    await inorder(
        root.left,
        result
    );

    result.push(root.value);

    createBars(result);

    updateExplanation(
        `Tree Sort: output ${root.value}`
    );

    await sleep(delay);

    await inorder(
        root.right,
        result
    );

}


async function treeSort(arr){

    let root=null;

    for(const value of arr){

        root =
            bstInsert(root,value);

        operations++;

        updateExplanation(
            `Insert ${value} into Binary Search Tree`
        );

        await sleep(delay/2);
    }

    let result=[];

    await inorder(root,result);

    for(let i=0;i<arr.length;i++)
        arr[i]=result[i];

    createBars(arr);

    updateExplanation(
        "🎉 Tree Sort Completed!"
    );

}


/* =========================================================
   COUNTING SORT
========================================================= */

async function countingSort(arr){

    if(arr.length===0)
        return;

    let min=Math.min(...arr);
    let max=Math.max(...arr);

    let count =
        new Array(max-min+1).fill(0);

    for(const value of arr){

        count[value-min]++;

        operations++;

        updateExplanation(
            `Counting occurrence of ${value}`
        );

        await sleep(delay/3);

    }

    let index=0;

    for(let i=0;i<count.length;i++){

        while(count[i]>0){

            arr[index++]=i+min;

            count[i]--;

            createBars(arr);

            updateExplanation(
                `Place ${i+min} into sorted array`
            );

            await sleep(delay/2);

        }

    }

    updateExplanation(
        "🎉 Counting Sort Completed!"
    );

}


/* =========================================================
   RADIX SORT
========================================================= */

async function radixSort(arr){

    if(arr.length===0)
        return;

    /*
       Educational implementation for
       non-negative integers.
    */

    if(arr.some(x=>x<0)){

        updateExplanation(
            "Radix Sort visualizer currently expects non-negative integers."
        );

        return;
    }

    let max=Math.max(...arr);

    for(let exp=1;
        Math.floor(max/exp)>0;
        exp*=10){

        let output =
            new Array(arr.length).fill(0);

        let count =
            new Array(10).fill(0);

        for(const value of arr){

            let digit =
                Math.floor(value/exp)%10;

            count[digit]++;

            operations++;

            updateExplanation(
                `Examining digit ${digit} of ${value}`
            );

            await sleep(delay/4);

        }

        for(let i=1;i<10;i++)
            count[i]+=count[i-1];

        for(let i=arr.length-1;i>=0;i--){

            let digit =
                Math.floor(arr[i]/exp)%10;

            output[
                --count[digit]
            ]=arr[i];

        }

        for(let i=0;i<arr.length;i++)
            arr[i]=output[i];

        createBars(arr);

        updateExplanation(
            `Radix Sort: processed digit place ${exp}`
        );

        await sleep(delay);

    }

    updateExplanation(
        "🎉 Radix Sort Completed!"
    );

}


/* =========================================================
   BUCKET SORT
========================================================= */

async function bucketSort(arr){

    if(arr.length===0)
        return;

    let min=Math.min(...arr);
    let max=Math.max(...arr);

    let bucketCount =
        Math.max(1,Math.ceil(Math.sqrt(arr.length)));

    let buckets =
        Array.from(
            {length:bucketCount},
            ()=>[]
        );

    for(const value of arr){

        let index =
            Math.min(
                bucketCount-1,
                Math.floor(
                    ((value-min)/(max-min || 1))
                    *bucketCount
                )
            );

        buckets[index].push(value);

        updateExplanation(
            `Place ${value} into bucket ${index}`
        );

        await sleep(delay/3);

    }

    let result=[];

    for(let i=0;i<buckets.length;i++){

        buckets[i].sort((a,b)=>a-b);

        updateExplanation(
            `Sort bucket ${i}`
        );

        await sleep(delay/2);

        result.push(...buckets[i]);

    }

    for(let i=0;i<arr.length;i++)
        arr[i]=result[i];

    createBars(arr);

    updateExplanation(
        "🎉 Bucket Sort Completed!"
    );

}


/* =========================================================
   TIM SORT
========================================================= */

async function timSort(arr){

    /*
       Educational TimSort:
       1. Divide into runs
       2. Insertion sort each run
       3. Merge runs
    */

    const RUN=4;

    for(let i=0;i<arr.length;i+=RUN){

        let end =
            Math.min(i+RUN,arr.length);

        for(let j=i+1;j<end;j++){

            let key=arr[j];
            let k=j-1;

            while(k>=i && arr[k]>key){

                comparisons++;

                arr[k+1]=arr[k];

                k--;

                createBars(arr);

                await sleep(delay/3);

            }

            arr[k+1]=key;

        }

    }

    for(let size=RUN;
        size<arr.length;
        size*=2){

        for(let left=0;
            left<arr.length;
            left+=2*size){

            let mid =
                Math.min(
                    left+size,
                    arr.length
                );

            let right =
                Math.min(
                    left+2*size,
                    arr.length
                );

            if(mid<right)
                await mergeRange(
                    arr,
                    left,
                    mid,
                    right
                );

        }

    }

    updateExplanation(
        "🎉 TimSort Completed!"
    );

}


async function mergeRange(
    arr,left,mid,right
){

    let a=arr.slice(left,mid);
    let b=arr.slice(mid,right);

    let i=0,j=0,k=left;

    while(i<a.length && j<b.length){

        comparisons++;

        if(a[i]<=b[j])
            arr[k++]=a[i++];
        else
            arr[k++]=b[j++];

    }

    while(i<a.length)
        arr[k++]=a[i++];

    while(j<b.length)
        arr[k++]=b[j++];

    createBars(arr);

    updateStats();

    await sleep(delay);

}


/* =========================================================
   INTRO SORT
========================================================= */

async function introSort(arr){

    /*
       IntroSort:
       QuickSort initially.
       If recursion depth becomes too large,
       switch to HeapSort.
    */

    let maxDepth =
        2*Math.floor(
            Math.log2(
                Math.max(arr.length,1)
            )
        );

    await introQuick(
        arr,
        0,
        arr.length-1,
        maxDepth
    );

    updateExplanation(
        "🎉 IntroSort Completed! QuickSort + HeapSort fallback."
    );

}


async function introQuick(
    arr,left,right,depth
){

    if(left>=right)
        return;

    if(depth<=0){

        let part =
            arr.slice(left,right+1);

        await heapSort(part);

        for(let i=0;i<part.length;i++)
            arr[left+i]=part[i];

        createBars(arr);

        return;
    }

    let pivot=arr[right];
    let p=left;

    for(let i=left;i<right;i++){

        comparisons++;

        if(arr[i]<pivot){

            await animatedSwap(
                arr,i,p
            );

            p++;
        }

    }

    await animatedSwap(
        arr,p,right
    );

    await introQuick(
        arr,
        left,
        p-1,
        depth-1
    );

    await introQuick(
        arr,
        p+1,
        right,
        depth-1
    );

}


/* =========================================================
   BITONIC SORT
========================================================= */

async function bitonicSort(arr){

    /*
       Bitonic sort works naturally with
       powers of two.
       Pad with Infinity for visualization.
    */

    let originalLength=arr.length;

    let n=1;

    while(n<arr.length)
        n*=2;

    while(arr.length<n)
        arr.push(Infinity);

    await bitonicRecursive(
        arr,
        0,
        n,
        true
    );

    arr.length=originalLength;

    createBars(arr);

    updateExplanation(
        "🎉 Bitonic Sort Completed!"
    );

}


async function bitonicRecursive(
    arr,low,cnt,ascending
){

    if(cnt<=1)
        return;

    let k=Math.floor(cnt/2);

    await bitonicRecursive(
        arr,
        low,
        k,
        true
    );

    await bitonicRecursive(
        arr,
        low+k,
        k,
        false
    );

    await bitonicMerge(
        arr,
        low,
        cnt,
        ascending
    );

}


async function bitonicMerge(
    arr,low,cnt,ascending
){

    if(cnt<=1)
        return;

    let k=greatestPowerOfTwoLessThan(cnt);

    for(let i=low;i<low+cnt-k;i++){

        comparisons++;

        let condition =
            ascending
            ? arr[i]>arr[i+k]
            : arr[i]<arr[i+k];

        if(condition)
            await animatedSwap(
                arr,i,i+k
            );

    }

    await bitonicMerge(
        arr,low,k,ascending
    );

    await bitonicMerge(
        arr,low+k,cnt-k,ascending
    );

}


function greatestPowerOfTwoLessThan(n){

    let k=1;

    while(k*2<n)
        k*=2;

    return k;

}


/* =========================================================
   K-WAY MERGE
========================================================= */

async function kWayMerge(arr){

    const K=3;

    let chunks=[];

    let size =
        Math.ceil(arr.length/K);

    for(let i=0;i<arr.length;i+=size){

        let chunk =
            arr.slice(i,i+size)
            .sort((a,b)=>a-b);

        chunks.push(chunk);

    }

    let result=[];

    while(true){

        let minValue=Infinity;
        let minChunk=-1;

        for(let i=0;i<chunks.length;i++){

            if(
                chunks[i].length &&
                chunks[i][0]<minValue
            ){

                minValue=chunks[i][0];
                minChunk=i;

            }

        }

        if(minChunk===-1)
            break;

        result.push(
            chunks[minChunk].shift()
        );

        operations++;

        updateExplanation(
            `K-Way Merge: choose smallest = ${minValue}`
        );

        createBars(result);

        await sleep(delay);

    }

    for(let i=0;i<arr.length;i++)
        arr[i]=result[i];

    createBars(arr);

    updateExplanation(
        "🎉 K-Way Merge Completed!"
    );

}


/* =========================================================
   EXTERNAL MERGE SORT
========================================================= */

async function externalMergeSort(arr){

    /*
       Browser simulation of external sorting:
       create sorted runs, then merge them.
    */

    const RUN_SIZE=4;

    let runs=[];

    for(let i=0;i<arr.length;i+=RUN_SIZE){

        let run =
            arr.slice(i,i+RUN_SIZE)
            .sort((a,b)=>a-b);

        runs.push(run);

        updateExplanation(
            `External Sort: create sorted run ${runs.length}`
        );

        await sleep(delay);

    }

    let result=[];

    while(runs.length){

        let newRuns=[];

        for(let i=0;i<runs.length;i+=2){

            if(i+1<runs.length){

                let merged =
                    mergeArrays(
                        runs[i],
                        runs[i+1]
                    );

                newRuns.push(merged);

            }else{

                newRuns.push(runs[i]);

            }

        }

        runs=newRuns;

        result=runs[0];

        createBars(result);

        await sleep(delay);

    }

    for(let i=0;i<arr.length;i++)
        arr[i]=result[i];

    createBars(arr);

    updateExplanation(
        "🎉 External Merge Sort Completed!"
    );

}


function mergeArrays(a,b){

    let result=[];
    let i=0,j=0;

    while(i<a.length && j<b.length){

        if(a[i]<=b[j])
            result.push(a[i++]);
        else
            result.push(b[j++]);

    }

    while(i<a.length)
        result.push(a[i++]);

    while(j<b.length)
        result.push(b[j++]);

    return result;

}


/* =========================================================
   PARALLEL SORTING
========================================================= */

async function parallelSorting(arr){

    /*
       Browser-friendly simulation:
       divide into independent chunks,
       sort them, then merge.
    */

    let workers=4;

    let size =
        Math.ceil(arr.length/workers);

    let chunks=[];

    for(let i=0;i<arr.length;i+=size){

        let chunk =
            arr.slice(i,i+size);

        updateExplanation(
            `Parallel Sorting: sort chunk ${chunks.length+1}`
        );

        chunk.sort((a,b)=>a-b);

        chunks.push(chunk);

        await sleep(delay);

    }

    while(chunks.length>1){

        let merged=[];

        for(let i=0;i<chunks.length;i+=2){

            if(i+1<chunks.length)
                merged.push(
                    mergeArrays(
                        chunks[i],
                        chunks[i+1]
                    )
                );
            else
                merged.push(chunks[i]);

        }

        chunks=merged;

        createBars(
            chunks.flat()
        );

        await sleep(delay);

    }

    let result=chunks[0] || [];

    for(let i=0;i<arr.length;i++)
        arr[i]=result[i];

    createBars(arr);

    updateExplanation(
        "🎉 Parallel Sorting Completed!"
    );

}


/* =========================================================
   DISTRIBUTED SORTING
========================================================= */

async function distributedSorting(arr){

    /*
       Simulates distributed sorting:
       partition → local sorting → global merge
    */

    const nodes=3;

    let size =
        Math.ceil(arr.length/nodes);

    let partitions=[];

    for(let i=0;i<arr.length;i+=size){

        let partition =
            arr.slice(i,i+size);

        updateExplanation(
            `Distributed Node ${partitions.length+1}: locally sorting data`
        );

        partition.sort((a,b)=>a-b);

        partitions.push(partition);

        createBars(
            partitions.flat()
        );

        await sleep(delay);

    }

    let result=[];

    while(partitions.some(p=>p.length)){

        let smallest=Infinity;
        let node=-1;

        partitions.forEach(
            (p,index)=>{

                if(
                    p.length &&
                    p[0]<smallest
                ){

                    smallest=p[0];
                    node=index;

                }

            }
        );

        if(node===-1)
            break;

        result.push(
            partitions[node].shift()
        );

        operations++;

        updateExplanation(
            `Global merge: receive ${smallest} from Node ${node+1}`
        );

        createBars(result);

        await sleep(delay/2);

    }

    for(let i=0;i<arr.length;i++)
        arr[i]=result[i];

    createBars(arr);

    updateExplanation(
        "🎉 Distributed Sorting Completed!"
    );

}


/* =========================================================
   LINEAR SEARCH
========================================================= */

async function linearSearch(arr,key){

    for(let i=0;i<arr.length;i++){

        comparisons++;

        let colors =
            new Array(arr.length).fill("");

        colors[i]="compare";

        createBars(arr,colors);

        updateExplanation(
            `Linear Search: checking index ${i}, value ${arr[i]}`
        );

        updateStats();

        await sleep(delay);

        if(arr[i]===key){

            colors[i]="found";

            createBars(arr,colors);

            updateExplanation(
                `✅ ${key} FOUND at index ${i}`
            );

        }

    }

    updateExplanation(
        `❌ ${key} was not found`
    );

}


/* =========================================================
   BINARY SEARCH
========================================================= */

async function binarySearch(arr,key){

    arr.sort((a,b)=>a-b);

    createBars(arr);

    updateExplanation(
        "Binary Search requires sorted data. Array sorted."
    );

    await sleep(delay);

    let low=0;
    let high=arr.length-1;

    while(low<=high){

        let mid =
            Math.floor((low+high)/2);

        comparisons++;

        let colors =
            new Array(arr.length).fill("");

        colors[mid]="active";

        createBars(arr,colors);

        updateExplanation(
            `low=${low}, mid=${mid}, high=${high}. Middle=${arr[mid]}`
        );

        updateStats();

        await sleep(delay);

        if(arr[mid]===key){

            colors[mid]="found";

            createBars(arr,colors);

            updateExplanation(
                `✅ ${key} FOUND at index ${mid}`
            );

            return;

        }

        if(arr[mid]<key){

            updateExplanation(
                `${arr[mid]} < ${key} → search RIGHT half`
            );

            low=mid+1;

        }else{

            updateExplanation(
                `${arr[mid]} > ${key} → search LEFT half`
            );

            high=mid-1;

        }

        await sleep(delay);

    }

    updateExplanation(
        `❌ ${key} was not found`
    );

}


/* =========================================================
   JUMP SEARCH
========================================================= */

async function jumpSearch(arr,key){

    arr.sort((a,b)=>a-b);

    createBars(arr);

    let n=arr.length;

    let step=Math.floor(Math.sqrt(n));

    let prev=0;

    while(
        prev<n &&
        arr[
            Math.min(step,n)-1
        ]<key
    ){

        comparisons++;

        updateExplanation(
            `Jump from index ${prev} to ${Math.min(step,n)-1}`
        );

        await sleep(delay);

        prev=step;
        step+=Math.floor(Math.sqrt(n));

        if(prev>=n)
            break;

    }

    while(
        prev<Math.min(step,n)
    ){

        comparisons++;

        createBars(
            arr,
            arr.map((_,i)=>
                i===prev ? "compare" : ""
            )
        );

        updateExplanation(
            `Linear scan inside block: index ${prev}`
        );

        await sleep(delay);

        if(arr[prev]===key){

            createBars(
                arr,
                arr.map((_,i)=>
                    i===prev ? "found" : ""
                )
            );

            updateExplanation(
                `✅ ${key} FOUND at index ${prev}`
            );

            return;

        }

        if(arr[prev]>key)
            break;

        prev++;

    }

    updateExplanation(
        `❌ ${key} was not found`
    );

}


/* =========================================================
   INTERPOLATION SEARCH
========================================================= */

async function interpolationSearch(arr,key){

    arr.sort((a,b)=>a-b);

    createBars(arr);

    let low=0;
    let high=arr.length-1;

    while(
        low<=high &&
        key>=arr[low] &&
        key<=arr[high]
    ){

        if(arr[high]===arr[low]){

            if(arr[low]===key){

                updateExplanation(
                    `✅ ${key} FOUND at index ${low}`
                );

                return;

            }

            break;
        }

        let pos =
            low +
            Math.floor(
                ((key-arr[low])*
                (high-low)) /
                (arr[high]-arr[low])
            );

        comparisons++;

        createBars(
            arr,
            arr.map((_,i)=>
                i===pos ? "active" : ""
            )
        );

        updateExplanation(
            `Interpolation estimates position ${pos}`
        );

        await sleep(delay);

        if(arr[pos]===key){

            createBars(
                arr,
                arr.map((_,i)=>
                    i===pos ? "found" : ""
                )
            );

            updateExplanation(
                `✅ ${key} FOUND at index ${pos}`
            );

            return;

        }

        if(arr[pos]<key)
            low=pos+1;
        else
            high=pos-1;

    }

    updateExplanation(
        `❌ ${key} was not found`
    );

}

async function exponentialSearch(arr,key){

    }

    let left=Math.floor(i/2);

        i,

    );

    );

    while(left<=right){

        let mid =

                (left+right)/2
            );

        comparisons++;

        createBars(

                index===mid ? "active" : ""
            )
        );

        updateExplanation(

        if(arr[mid]===key){

    }

    updateExplanation(

    );

}


/* =========================================================
   FIBONACCI SEARCH
========================================================= */

async function fibonacciSearch(arr,key){

    arr.sort((a,b)=>a-b);

    createBars(arr);

    let n=arr.length;

    let fibM2=0;
    let fibM1=1;
    let fibM=fibM2+fibM1;

    while(fibM<n){

        fibM2=fibM1;
        fibM1=fibM;
        fibM=fibM2+fibM1;

    }

    let offset=-1;

    while(fibM>1){

        let i=Math.min(
            offset+fibM2,
            n-1
        );

        comparisons++;

        createBars(
            arr,
            arr.map((_,index)=>
                index===i ? "active" : ""
            )
        );

        updateExplanation(
            `Fibonacci Search checks index ${i}`
        );

        await sleep(delay);

        if(arr[i]<key){

            fibM=fibM1;
            fibM1=fibM2;
            fibM2=fibM-fibM1;

            offset=i;

        }else if(arr[i]>key){

            fibM=fibM2;
            fibM1=fibM1-fibM2;
            fibM2=fibM-fibM1;

        }else{

            updateExplanation(
                `✅ ${key} FOUND at index ${i}`
            );

            return;

        }

    }

    if(
        fibM1 &&
        offset+1<n &&
        arr[offset+1]===key
    ){

        updateExplanation(
            `✅ ${key} FOUND at index ${offset+1}`
        );

        return;

    }

    updateExplanation(
        `❌ ${key} was not found`
    );

}

async function bstSearch(arr,key){

    for(const value of arr)

    );

/* =========================================================
   AVL TREE
========================================================= */

class AVLNode{

    constructor(value){

        this.value=value;
        this.left=null;
        this.right=null;
        this.height=1;

    }

}


function avlHeight(node){
    return node ? node.height : 0;
}


function avlBalance(node){

    return node
        ? avlHeight(node.left)-
          avlHeight(node.right)
        : 0;

}


function avlRightRotate(y){

    let x=y.left;
    let t=x.right;

    x.right=y;
    y.left=t;

    y.height=
        1+
        Math.max(
            avlHeight(y.left),
            avlHeight(y.right)
        );

    x.height=
        1+
        Math.max(
            avlHeight(x.left),
            avlHeight(x.right)
        );

    return x;

}


function avlLeftRotate(x){

    let y=x.right;
    let t=y.left;

    y.left=x;
    x.right=t;

    x.height=
        1+
        Math.max(
            avlHeight(x.left),
            avlHeight(x.right)
        );

    y.height=
        1+
        Math.max(
            avlHeight(y.left),
            avlHeight(y.right)
        );

    return y;

}


function avlInsert(root,value){

    if(!root)
        return new AVLNode(value);

    if(value<root.value)
        root.left=
            avlInsert(root.left,value);
    else if(value>root.value)
        root.right=
            avlInsert(root.right,value);
    else
        return root;

    root.height=
        1+
        Math.max(
            avlHeight(root.left),
            avlHeight(root.right)
        );

    let balance=
        avlBalance(root);

    if(balance>1 && value<root.left.value)
        return avlRightRotate(root);

    if(balance<-1 && value>root.right.value)
        return avlLeftRotate(root);

    if(balance>1 && value>root.left.value){

        root.left=
            avlLeftRotate(root.left);

        return avlRightRotate(root);

    }

    if(balance<-1 && value<root.right.value){

        root.right=
            avlRightRotate(root.right);

        return avlLeftRotate(root);

    }

    return root;

}


async function avlSearch(arr,key){

    let root=null;

    for(const value of arr)
        root=avlInsert(root,value);

    let current=root;

    while(current){

        comparisons++;

        updateExplanation(
            `AVL Search: compare ${key} with ${current.value}`
        );

        await sleep(delay);

        if(key===current.value){

            updateExplanation(
                `✅ ${key} FOUND in AVL Tree`
            );

            return;

        }

        current =
            key<current.value
            ? current.left
            : current.right;

    }

    updateExplanation(
        `❌ ${key} not found in AVL Tree`
    );

}


/* =========================================================
   RED-BLACK TREE
========================================================= */

class RBNode{

    constructor(value){

        this.value=value;
        this.left=null;
        this.right=null;

    }

}


/*
   For the visualizer, use a balanced
   red-black-style search structure.

   JavaScript Map/BST-style ordering is
   sufficient for demonstrating search path.
*/

async function redBlackSearch(arr,key){

    let values=
        [...new Set(arr)]
        .sort((a,b)=>a-b);

    /*
       Build a balanced tree representation.
    */

    function buildBalanced(a,l,r){

        if(l>r)
            return null;

        let m=
            Math.floor((l+r)/2);

        let node=
            new RBNode(a[m]);

        node.left=
            buildBalanced(a,l,m-1);

        node.right=
            buildBalanced(a,m+1,r);

        return node;

    }

    let root=
        buildBalanced(
            values,
            0,
            values.length-1
        );

    let current=root;

    while(current){

        comparisons++;

        updateExplanation(
            `Red-Black Tree search: compare ${key} with ${current.value}`
        );

        await sleep(delay);

        if(key===current.value){

            updateExplanation(
                `✅ ${key} FOUND in Red-Black Tree`
            );

            return;

        }

        current=
            key<current.value
            ? current.left
            : current.right;

    }

    updateExplanation(
        `❌ ${key} not found in Red-Black Tree`
    );

}


/* =========================================================
   B-TREE
========================================================= */

class BTreeNode{

    constructor(){

        this.keys=[];
        this.children=[];

    }

}


function bTreeBuild(arr){

    /*
       Educational B-Tree node
       construction with degree 3.
    */

    let values=
        [...new Set(arr)]
        .sort((a,b)=>a-b);

    let root=
        new BTreeNode();

    root.keys=
        values.slice(
            0,
            Math.min(3,values.length)
        );

    return root;

}


async function bTreeSearch(arr,key){

    /*
       For an educational browser visualizer,
       demonstrate the B-Tree node search.
    */

    let values=
        [...new Set(arr)]
        .sort((a,b)=>a-b);

    let node=
        bTreeBuild(values);

    comparisons++;

    updateExplanation(
        `B-Tree: search inside node [${node.keys.join(", ")}]`
    );

    await sleep(delay);

    if(node.keys.includes(key)){

        updateExplanation(
            `✅ ${key} FOUND in B-Tree node`
        );

        return;

    }

    /*
       Continue using ordered ranges.
    */

    let low=0;
    let high=values.length-1;

    while(low<=high){

        let mid=
            Math.floor(
                (low+high)/2
            );

        comparisons++;

        updateExplanation(
            `B-Tree ordered search: compare with ${values[mid]}`
        );

        await sleep(delay);

        if(values[mid]===key){

            updateExplanation(
                `✅ ${key} FOUND in B-Tree`
            );

            return;

        }

        if(values[mid]<key)
            low=mid+1;
        else
            high=mid-1;

    }

    updateExplanation(
        `❌ ${key} not found in B-Tree`
    );

}


/* =========================================================
   TRIE
========================================================= */

class TrieNode{

    constructor(){

        this.children={};
        this.end=false;

    }

}


function trieInsert(root,word){

    let node=root;

    for(const ch of String(word)){

        if(!node.children[ch])
            node.children[ch]=
                new TrieNode();

        node=node.children[ch];

    }

    node.end=true;

}


async function trieSearch(arr,key){

    let root=
        new TrieNode();

    for(const value of arr)
        trieInsert(
            root,
            String(value)
        );

    let word=
        String(key);

    let node=root;

    for(let i=0;i<word.length;i++){

        let ch=word[i];

        operations++;

        updateExplanation(
            `Trie: follow character '${ch}'`
        );

        await sleep(delay);

        if(!node.children[ch]){

            updateExplanation(
                `❌ ${key} not found in Trie`
            );

            return;

        }

        node=
            node.children[ch];

    }

    if(node.end){

        updateExplanation(
            `✅ ${key} FOUND in Trie`
        );

    }else{

        updateExplanation(
            `❌ ${key} not found in Trie`
        );

    }

}


/* =========================================================
   GRAPH CREATION
========================================================= */

function createGraph(arr){

    /*
       Create a simple graph where each array
       position connects to the next two positions.
    */

    let graph=
        Array.from(
            {length:arr.length},
            ()=>[]
        );

    for(let i=0;i<arr.length;i++){

        if(i+1<arr.length)
            graph[i].push(i+1);

        if(i+2<arr.length)
            graph[i].push(i+2);

    }

    return graph;

}


/* =========================================================
   BFS
========================================================= */

async function bfs(arr,key){

    let graph=
        createGraph(arr);

    let start=0;

    let queue=[start];

    let visited=
        new Set();

    while(queue.length){

        let node=
            queue.shift();

        if(visited.has(node))
            continue;

        visited.add(node);

        comparisons++;

        createBars(
            arr,
            arr.map((_,i)=>
                i===node ? "active" : ""
            )
        );

        updateExplanation(
            `BFS visits node ${node} with value ${arr[node]}`
        );

        await sleep(delay);

        if(arr[node]===key){

            createBars(
                arr,
                arr.map((_,i)=>
                    i===node ? "found" : ""
                )
            );

            updateExplanation(
                `✅ BFS FOUND ${key} at node ${node}`
            );

            return;

        }

        for(const next of graph[node]){

            if(!visited.has(next))
                queue.push(next);

        }

    }

    updateExplanation(
        `❌ BFS did not find ${key}`
    );

}


/* =========================================================
   DFS
========================================================= */

async function dfs(arr,key){

    let graph=
        createGraph(arr);

    let visited=
        new Set();

    async function visit(node){

        if(
            node<0 ||
            node>=arr.length ||
            visited.has(node)
        )
            return false;

        visited.add(node);

        comparisons++;

        createBars(
            arr,
            arr.map((_,i)=>
                i===node ? "active" : ""
            )
        );

        updateExplanation(
            `DFS visits node ${node} with value ${arr[node]}`
        );

        await sleep(delay);

        if(arr[node]===key){

            createBars(
                arr,
                arr.map((_,i)=>
                    i===node ? "found" : ""
                )
            );

            return true;

        }

        for(const next of graph[node]){

            if(await visit(next))
                return true;

        }

        return false;

    }

    let found=
        await visit(0);

    updateExplanation(
        found
        ? `✅ DFS FOUND ${key}`
        : `❌ DFS did not find ${key}`
    );

}


/* =========================================================
   MAIN START FUNCTION
========================================================= */

async function start(){

    if(running)
        return;

    running=true;

    delay=
        Number(
            document.getElementById("speed").value
        );

    comparisons=0;
    swaps=0;
    operations=0;

    let input=
        document.getElementById(
            "arrayInput"
        ).value.trim();

    if(!input){

        updateExplanation(
            "⚠️ Please enter numbers first."
        );

        running=false;
        return;

    }

    let arr=
        input
        .split(",")
        .map(x=>Number(x.trim()))
        .filter(x=>!Number.isNaN(x));

    if(arr.length===0){

        updateExplanation(
            "⚠️ Invalid input."
        );

        running=false;
        return;

    }

    let algo=
        algorithmSelect.value;

    let key=
        Number(searchKey.value);

    createBars(arr);

    updateStats();

    try{

        /* SORTING */

        if(algo==="Bubble Sort")
            await bubbleSort(arr);

        else if(algo==="Selection Sort")
            await selectionSort(arr);

        else if(algo==="Insertion Sort")
            await insertionSort(arr);

        else if(algo==="Shell Sort")
            await shellSort(arr);

        else if(algo==="Merge Sort")
            await mergeSort(
                arr,
                0,
                arr.length-1
            );

        else if(algo==="Quick Sort")
            await quickSort(
                arr,
                0,
                arr.length-1
            );

        else if(algo==="Heap Sort")
            await heapSort(arr);

        else if(algo==="Tree Sort")
            await treeSort(arr);

        else if(algo==="TimSort")
            await timSort(arr);

        else if(algo==="IntroSort")
            await introSort(arr);

        else if(algo==="Counting Sort")
            await countingSort(arr);

        else if(algo==="Radix Sort")
            await radixSort(arr);

        else if(algo==="Bucket Sort")
            await bucketSort(arr);

        else if(algo==="External Merge Sort")
            await externalMergeSort(arr);

        else if(algo==="K-Way Merge")
            await kWayMerge(arr);

        else if(algo==="Bitonic Sort")
            await bitonicSort(arr);

        else if(algo==="Parallel Sorting")
            await parallelSorting(arr);

        else if(algo==="Distributed Sorting")
            await distributedSorting(arr);


        /* SEARCHING */

        else if(algo==="Linear Search")
            await linearSearch(
                arr,
                key
            );

        else if(algo==="Binary Search")
            await binarySearch(
                arr,
                key
            );

        else if(algo==="Jump Search")
            await jumpSearch(
                arr,
                key
            );

        else if(algo==="Interpolation Search")
            await interpolationSearch(
                arr,
                key
            );

        else if(algo==="Exponential Search")
            await exponentialSearch(
                arr,
                key
            );

        else if(algo==="Fibonacci Search")
            await fibonacciSearch(
                arr,
                key
            );

        else if(algo==="Hash Search")
            await hashSearch(
                arr,
                key
            );

        else if(algo==="BST Search")
            await bstSearch(
                arr,
                key
            );

        else if(algo==="AVL Tree Search")
            await avlSearch(
                arr,
                key
            );

        else if(algo==="Red-Black Tree Search")
            await redBlackSearch(
                arr,
                key
            );

        else if(algo==="B-Tree Search")
            await bTreeSearch(
                arr,
                key
            );

        else if(algo==="Trie Search")
            await trieSearch(
                arr,
                key
            );

        else if(algo==="BFS")
            await bfs(
                arr,
                key
            );

        else if(algo==="DFS")
            await dfs(
                arr,
                key
            );

    }catch(error){

        console.error(error);

        updateExplanation(
            "⚠️ Error: " + error.message
        );

    }

    updateStats();

    running=false;

}


/* =========================================================
   RESET
========================================================= */

function resetVisualizer(){

    running=false;

    comparisons=0;
    swaps=0;
    operations=0;

    document.getElementById(
        "arrayContainer"
    ).innerHTML="";

    updateExplanation(
        "Welcome! Enter numbers and select an algorithm."
    );

    updateStats();

}

========================================================= */

document
.getElementById("arrayInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter")
            start();

    }
);
